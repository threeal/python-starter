name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        uses: dprint/check@v2.5

      - name: Check lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -v --cov

      - name: Build
        run: uv build
