name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dprint
        uses: taiki-e/install-action@v2
        with:
          tool: dprint

      - name: Setup Lefthook
        uses: threeal/setup-lefthook-action@v1.0.0

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

      - name: Test
        run: uv run pytest -v --cov

      - name: Build
        run: uv build
